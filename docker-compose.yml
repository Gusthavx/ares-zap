# Postgres para desenvolvimento e produção simples. Porta só na máquina local (127.0.0.1).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: areszap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-areszap}
      POSTGRES_DB: areszap
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U areszap"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
